services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vidlixroot
      MYSQL_DATABASE: vidlix
      MYSQL_USER: vidlix
      MYSQL_PASSWORD: vidlix
    ports:
      - "33306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://vidlix:vidlix@db:3306/vidlix
    command: tail -f /dev/null
    depends_on:
      - db

volumes:
  db_data:
